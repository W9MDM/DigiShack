<!doctype html>
<html lang="en" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>DigiShack — offline</title>
    <!--
      Deliberately self-contained: no stylesheet, no font, no script. This page is
      served by the service worker when the network is gone, so anything it references
      is something else that has to be in the cache and might not be. The colours are
      copied from styles/globals.css rather than imported for the same reason.
    -->
    <style>
      :root {
        --bg: #0a0a0b;
        --surface: #131316;
        --line: #2e2e36;
        --fg: #f2f2f4;
        --muted: #a1a1ac;
        --accent: #ff5c3d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 28rem;
        border: 1px solid var(--line);
        border-radius: 0.25rem;
        background: var(--surface);
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      h1 span { color: var(--accent); }
      p { margin: 0.75rem 0 0; color: var(--muted); line-height: 1.5; font-size: 0.9375rem; }
      ul { margin: 0.75rem 0 0; padding-left: 1.25rem; color: var(--muted); font-size: 0.9375rem; line-height: 1.6; }
      button {
        margin-top: 1.25rem;
        min-height: 44px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 0.25rem;
        background: #26262d;
        color: var(--fg);
        font: inherit;
        font-size: 0.9375rem;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Digi<span>Shack</span> is offline</h1>
      <p>
        This device cannot reach the shack server. The radio is unaffected — DigiShack
        runs on the server, so logging, decoding and any automatic operation carry on
        without this screen.
      </p>
      <ul>
        <li>Check this device is on the shack network or VPN.</li>
        <li>Check the server itself is up.</li>
      </ul>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
