# NGINX site config for DigiShack.
#
#   sudo cp deploy/nginx/digishack.conf /etc/nginx/sites-available/digishack
#   sudo ln -s /etc/nginx/sites-available/digishack /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust server_name and the TLS paths for your host.

upstream digishack_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# The bridge's HTTP + WebSocket listener (services/radio).
upstream digishack_bridge {
    server 127.0.0.1:3101;
    keepalive 8;
}

# THE REAL CLIENT ADDRESS, when something local terminates the connection.
#
# `X-Real-IP $remote_addr` is set on every proxy_pass below, and on a tunnelled install it was
# sending `::1` for every request in the world. Cloudflare Tunnel (`cloudflared`) connects OUT
# from the host and forwards to nginx over loopback, so `$remote_addr` is loopback — correctly,
# because that genuinely is who connected.
#
# MEASURED on a live install: requests from three different networks, including one from
# another continent, all appeared in the access log as `::1`. The consequences were not
# cosmetic. The login throttle keys on X-Real-IP, so every attacker on earth shared one bucket
# and the key degenerated to the email address alone; and `Session.ip` recorded `::1` for every
# session, which is an audit trail that cannot answer the only question ever asked of it.
#
# So: trust loopback ONLY, and take the address from the header the tunnel sets. Trusting a
# wider range would let a client forge it — which is exactly why `X-Forwarded-For` is not used
# here, its element 0 being attacker-chosen.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# RATE LIMITS, per client address. Motivated by another club site taking eight million
# requests with nothing in front of it.
#
# HTTP CONTEXT. limit_req_zone and limit_conn_zone are only accepted at http{} level. This
# file is installed as /etc/nginx/sites-enabled/digishack, which the stock nginx.conf
# includes INSIDE http{} — the same reason the upstream, real_ip and log_format lines above
# are legal here. Including it anywhere else (inside a server{}) makes nginx -t fail.
#
# KEYED ON $binary_remote_addr, which is the REAL visitor: the real_ip lines above rewrite
# it from CF-Connecting-IP for anything arriving from the tunnel on loopback. Without them
# every visitor on earth would share one bucket and the first busy minute would 429 the
# whole site.
#
# SIZED FROM THE CLIENT'S OWN TIMERS, not guessed (the arithmetic is in lib/auth/throttle.ts):
# the Digital page and the Rig page open together make about 110 API requests a minute,
# ~2 a second, with page-load bursts of a dozen. The app adds its own per-user and per-key
# limits behind these; nginx's job is the coarse per-address cap, and to bound traffic that
# carries no credentials at all, which the app cannot attribute to anyone.
#
#   digishack_api    /api/*           40 r/s, burst 400   ~20x both pages open; room for
#                                                          a club on one connection
#   digishack_heavy  exports, CSV,    30 r/min, burst 30   whole-logbook work; matches the
#                    QSO map, v1        app's map budget so a filter-clicking operator is
#                    awards/ADIF        never refused here before the app would refuse them
#   digishack_pages  everything else  10 r/s, burst 200   pages and /_next/data
#   digishack_conn   concurrent       60 per address      NOT applied to the WebSockets
#
# NOT LIMITED: /ws/decodes and /ws/audio (a long-lived socket is one request; reconnects are
# already backed off by the client) and /_next/static (immutable, content-hashed, cached).
# /api/v1/ as a whole is NOT in the tight zone, deliberately: docs/radio-api.md tells a desk
# dial to poll /api/v1/radio/state "a few times a second", and a few a minute would break
# the documented contract. Only its whole-logbook routes are.
limit_req_zone  $binary_remote_addr zone=digishack_api:10m   rate=40r/s;
limit_req_zone  $binary_remote_addr zone=digishack_heavy:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=digishack_pages:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=digishack_conn:10m;

# Log the real address rather than the proxy's, for the same reason.
log_format digishack '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name digishack.example.com;
    access_log /var/log/nginx/access.log digishack;

    # Uncomment once certbot has issued a certificate.
    # return 301 https://$host$request_uri;

    # 429 rather than nginx's default 503: "slow down", not "the server is broken". Set per
    # server rather than at the top, so other sites on the same nginx keep their defaults.
    limit_req_status    429;
    limit_conn_status   429;
    limit_req_log_level warn;

    # ADIF imports can be large; the default 1m is too small for a full logbook.
    client_max_body_size 64m;

    # Long-lived streams (live decode feed) must not be buffered or cut short.
    proxy_http_version 1.1;

    # THE HEADER TRAP — why every location below repeats these four lines.
    #
    # proxy_set_header directives at server level are inherited by a location ONLY
    # if that location declares none of its own. One `proxy_set_header Connection ""`
    # in a location silently drops Host and all the X-Forwarded-* set at server
    # level, and nginx then forwards its DEFAULT Host: the upstream's name. The app
    # built its WebSocket URL from that Host, and every browser on a deployed
    # install tried wss://digishack_web/ws/decodes — a name that exists only inside
    # this file — while the decode page sat on "connecting" forever. Deduplicating
    # these lines back to server level is exactly the change that reintroduces it.

    # Pages and /_next/data: their own zone, so a page load's assets do not spend the API's.
    location / {
        limit_req  zone=digishack_pages burst=200 nodelay;
        limit_conn digishack_conn 60;
        proxy_pass http://digishack_web;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- The app's API, rate limited per address (zones at the top of this file) ----
    #
    # nodelay: a burst inside the allowance is answered at once rather than queued, so a page
    # load's dozen parallel requests are not spread out over seconds. Same four header lines
    # as everywhere else; see THE HEADER TRAP above.
    location /api/ {
        limit_req  zone=digishack_api burst=400 nodelay;
        limit_conn digishack_conn 60;
        proxy_pass http://digishack_web;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Whole-logbook routes: ADIF/CSV export, the QSO map, and the public API's awards and
    # ADIF import. A regex location, so it wins over the /api/ prefix above. Exact paths
    # only: the rest of /api/v1/ (radio state, which a dial polls several times a second)
    # stays on the general zone.
    location ~ ^/api/(?:adif/export|adif/csv|qso-map|v1/adif|v1/awards)$ {
        limit_req  zone=digishack_heavy burst=30 nodelay;
        limit_conn digishack_conn 60;
        proxy_pass http://digishack_web;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js build assets are content-hashed and immutable. NOT rate limited: a cold load
    # fetches dozens at once, and they cost nothing to serve.
    location /_next/static/ {
        proxy_pass http://digishack_web;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Live decode WebSocket, served by the bridge process ----
    #
    # AUTHENTICATED BY THE BRIDGE, not here (lib/bridge/ws-auth.ts). It admits a browser on
    # the session cookie the browser already sends with a same-origin handshake, after
    # checking that Origin names the Host below — so `Host $host` is load-bearing twice over
    # now: drop it and every browser gets 403 instead of a socket. X-Real-IP and
    # X-Forwarded-For are what tell the bridge a request came through a proxy, which is what
    # stops it honouring its own token (bridge.token) from anyone but a process on this box
    # connecting straight to 127.0.0.1:3101. The X-Bridge-Token line drops any copy a client
    # sends, so that holds here by construction as well as by the bridge's check.
    location /ws/decodes {
        proxy_pass http://digishack_bridge;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Token    "";
        # FT8 transmits for ~13s of every 15s cycle and is silent in between, so a
        # short read timeout would drop an idle-but-healthy socket.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
    }

    # ---- Receiver audio WebSocket, also the bridge ----
    #
    # This block was MISSING, and its absence is the whole of "the Listen button doesn't
    # work". The bridge binds 127.0.0.1 only, so a browser on any other machine reaches
    # it exclusively through here. Without the location, /ws/audio fell through to
    # `location /`, was proxied to the Next.js app, found no such route and never
    # upgraded — so the socket closed instantly and the button sprang back to "Listen".
    #
    # The decode socket next door had this all along, which is exactly why the waterfall
    # worked while audio did not, and why it read as a broken button rather than as a
    # missing proxy rule. `bridge.bindAddress`'s own help text has recommended proxying
    # BOTH sockets since it was written; only one of them was ever configured.
    #
    # Same authentication contract as /ws/decodes above, header for header.
    location /ws/audio {
        proxy_pass http://digishack_bridge;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Token    "";
        # Audio is a continuous stream rather than a burst, but the same long timeouts
        # apply: a receiver on a quiet band sends silence, not nothing.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        # Buffering MUST stay off. This is a live stream being scheduled against an
        # AudioContext in the browser; nginx holding packets back to fill a buffer is
        # heard as stutter and shows up as underruns in the page's own diagnostics.
        proxy_buffering     off;
    }

    # The bridge's control API (/reply, /halt, /highlight, …) is deliberately NOT
    # proxied. Those endpoints make the radio transmit. The web app reaches them
    # over localhost with a shared token; exposing them publicly would let anyone
    # who guessed the token key up the transmitter.
    #
    # Long-running syncs (a full LoTW history) can exceed the 60s default.
    location /api/integrations/ {
        limit_req  zone=digishack_api burst=400 nodelay;
        limit_conn digishack_conn 60;
        proxy_pass http://digishack_web;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

